name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validator tests and example check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Validator tests
        run: bun test tools/
      - name: Example resume traces to the example MCD
        run: bun tools/validate.ts examples/sample-output/Resume-Alex_Morgan-Example_Corp-Senior_Engineer.tex examples/Master_Career_Document.md

  latex:
    name: Compile LaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live (same packages the README lists)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-fonts-recommended \
            texlive-fonts-extra texlive-latex-extra cm-super poppler-utils
      - name: Compile templates and examples
        run: |
          mkdir -p build
          for tex in templates/*.tex examples/sample-output/*.tex; do
            name=$(basename "$tex" .tex)
            echo "::group::$tex"
            # Two passes for lastpage and hyperref cross references.
            for pass in 1 2; do
              pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build "$tex" > "build/$name.pass$pass.txt" \
                || { tail -40 "build/$name.pass$pass.txt"; exit 1; }
            done
            test -s "build/$name.pdf"
            echo "::endgroup::"
          done
      - name: Render page one of each PDF to PNG
        run: |
          for pdf in build/*.pdf; do
            pdftoppm -png -r 200 -f 1 -l 1 -singlefile "$pdf" "${pdf%.pdf}"
          done
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-output
          path: |
            build/*.pdf
            build/*.png
