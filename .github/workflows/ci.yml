name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Branch protection requires a check with this exact name. The matrix legs
  # report as "... (ubuntu-latest)" etc., so this job carries the required
  # name and fails unless every leg passed (a skipped job would count as passing).
  validate:
    name: Validator tests and example check
    needs: validate-os
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every OS leg passed
        run: |
          echo "validate-os result: ${{ needs.validate-os.result }}"
          test "${{ needs.validate-os.result }}" = success

  validate-os:
    name: Validator tests and example check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows catches line-ending bugs (CRLF hid MCD headings from the validator).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned so a new Bun release cannot change test results under us.
          bun-version: 1.4.4
      - name: Validator, export, and ingest tests
        run: bun test tools/
      - name: Example resume traces to the example MCD
        run: bun tools/validate.ts examples/sample-output/Resume-Alex_Morgan-Example_Corp-Senior_Engineer.tex examples/Master_Career_Document.md
      - name: Plain-text export of the example also traces to the MCD
        run: |
          bun tools/export-text.ts examples/sample-output/Resume-Alex_Morgan-Example_Corp-Senior_Engineer.tex example-resume.txt
          if grep -n '[\\{}~]' example-resume.txt; then echo 'LaTeX left in the export'; exit 1; fi
          bun tools/validate.ts example-resume.txt examples/Master_Career_Document.md
      - name: Example cover letter traces to the MCD plus the job description
        run: |
          bun tools/validate.ts examples/sample-output/CoverLetter-Alex_Morgan-Example_Corp-Senior_Engineer.tex examples/Master_Career_Document.md examples/Job_Description-Example_Corp-Senior_Engineer.md
          bun tools/export-text.ts examples/sample-output/CoverLetter-Alex_Morgan-Example_Corp-Senior_Engineer.tex example-cover.txt
          if grep -n '[\\{}~]' example-cover.txt; then echo 'LaTeX left in the export'; exit 1; fi
          bun tools/validate.ts example-cover.txt examples/Master_Career_Document.md examples/Job_Description-Example_Corp-Senior_Engineer.md

  version:
    name: Plugin version moves when shipped files change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A change to agents/, tools/, or templates/ since the last tag needs a new plugin.json version
        run: bash .github/scripts/version-bump.sh
      - name: No real candidate data is committed (output/, candidates/, inputs/, root MCD or job descriptions)
        run: |
          found=$(git ls-files -- output candidates inputs Master_Career_Document.md 'Job_Description-*.md' | grep -vx 'output/.gitkeep' || true)
          if [ -n "$found" ]; then
            echo "These paths hold real candidates' files and must never be committed:"
            echo "$found"
            exit 1
          fi

  latex:
    name: Compile LaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install TeX Live (same packages the README lists)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-fonts-recommended \
            texlive-fonts-extra texlive-latex-extra cm-super poppler-utils
      - name: Compile templates and examples
        run: |
          mkdir -p build
          for tex in templates/*.tex examples/sample-output/*.tex; do
            name=$(basename "$tex" .tex)
            echo "::group::$tex"
            # Two passes for lastpage and hyperref cross references.
            for pass in 1 2; do
              pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build "$tex" > "build/$name.pass$pass.txt" \
                || { tail -40 "build/$name.pass$pass.txt"; exit 1; }
            done
            test -s "build/$name.pdf"
            echo "::endgroup::"
          done
      - name: Header separators reach the PDF text layer as |, not as em dashes
        run: |
          pdftotext -enc UTF-8 -l 1 build/Resume-Alex_Morgan-Example_Corp-Senior_Engineer.pdf - | tee resume-text.txt | head -5
          grep -q 'Austin, TX |' resume-text.txt
      - name: Render page one of each PDF to PNG
        run: |
          for pdf in build/*.pdf; do
            pdftoppm -png -r 200 -f 1 -l 1 -singlefile "$pdf" "${pdf%.pdf}"
          done
          ls -la build
      - uses: actions/upload-artifact@v7
        with:
          name: compiled-output
          path: |
            build/*.pdf
            build/*.png

  plugin:
    name: Plugin manifest and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code with the command the README gives
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Plugin agents match the project agents clone users load
        run: diff -r agents .claude/agents || { echo "agents/ and .claude/agents/ must be identical. Edit both, or copy one over the other."; exit 1; }
      # Not --strict: it turns warnings into errors, and the root CLAUDE.md,
      # which clone users need, always draws the warning that a plugin does not
      # load CLAUDE.md as context. The plugin directory checks also note there
      # is no icon. That check does not change the result, and the first icon
      # submitted becomes the listing icon for good, so it is left to the
      # maintainer instead of being generated here.
      - name: Validate plugin and marketplace manifests
        run: |
          claude --version
          claude plugin validate .
          claude plugin validate agents
      - name: Install the plugin from this checkout and list its agents
        run: |
          claude plugin marketplace add ./
          claude plugin install ats-resume-agent@nullspace-bitcradle
          claude plugin details ats-resume-agent | tee details.txt
          grep -q ats-resume-writer details.txt
          grep -q career-doc-builder details.txt
