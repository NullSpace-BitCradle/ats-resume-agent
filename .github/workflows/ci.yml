name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validator tests and example check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Validator tests
        run: bun test tools/
      - name: Example resume traces to the example MCD
        run: bun tools/validate.ts examples/sample-output/Resume-Alex_Morgan-Example_Corp-Senior_Engineer.tex examples/Master_Career_Document.md
      - name: Plain-text export of the example also traces to the MCD
        run: |
          bun tools/export-text.ts examples/sample-output/Resume-Alex_Morgan-Example_Corp-Senior_Engineer.tex example-resume.txt
          if grep -n '[\\{}]' example-resume.txt; then echo 'LaTeX left in the export'; exit 1; fi
          bun tools/validate.ts example-resume.txt examples/Master_Career_Document.md
      - name: Example cover letter traces to the MCD plus the job description
        run: |
          bun tools/validate.ts examples/sample-output/CoverLetter-Alex_Morgan-Example_Corp-Senior_Engineer.tex examples/Master_Career_Document.md examples/Job_Description-Example_Corp-Senior_Engineer.md
          bun tools/export-text.ts examples/sample-output/CoverLetter-Alex_Morgan-Example_Corp-Senior_Engineer.tex example-cover.txt
          if grep -n '[\\{}]' example-cover.txt; then echo 'LaTeX left in the export'; exit 1; fi
          bun tools/validate.ts example-cover.txt examples/Master_Career_Document.md examples/Job_Description-Example_Corp-Senior_Engineer.md

  latex:
    name: Compile LaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live (same packages the README lists)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-fonts-recommended \
            texlive-fonts-extra texlive-latex-extra cm-super poppler-utils
      - name: Compile templates and examples
        run: |
          mkdir -p build
          for tex in templates/*.tex examples/sample-output/*.tex; do
            name=$(basename "$tex" .tex)
            echo "::group::$tex"
            # Two passes for lastpage and hyperref cross references.
            for pass in 1 2; do
              pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build "$tex" > "build/$name.pass$pass.txt" \
                || { tail -40 "build/$name.pass$pass.txt"; exit 1; }
            done
            test -s "build/$name.pdf"
            echo "::endgroup::"
          done
      - name: Render page one of each PDF to PNG
        run: |
          for pdf in build/*.pdf; do
            pdftoppm -png -r 200 -f 1 -l 1 -singlefile "$pdf" "${pdf%.pdf}"
          done
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-output
          path: |
            build/*.pdf
            build/*.png

  plugin:
    name: Plugin manifest and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code with the command the README gives
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Plugin agents match the project agents clone users load
        run: diff -r agents .claude/agents || { echo "agents/ and .claude/agents/ must be identical. Edit both, or copy one over the other."; exit 1; }
      - name: Validate plugin and marketplace manifests
        run: |
          claude --version
          claude plugin validate .
          claude plugin validate agents
      - name: Install the plugin from this checkout and list its agents
        run: |
          claude plugin marketplace add ./
          claude plugin install ats-resume-agent@nullspace-bitcradle
          claude plugin details ats-resume-agent | tee details.txt
          grep -q ats-resume-writer details.txt
          grep -q career-doc-builder details.txt
